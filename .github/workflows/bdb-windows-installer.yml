name: BDB Windows Installer

# Reusable: builds the NSIS installer and smoke-tests it (silent install,
# doctor, silent uninstall). Uploads artifact `Codenotch-Setup` and nothing
# else. Called by bdb-windows.yml (proof, no upload) and bdb-build.yml
# (tag releases). Steps mirror upstream's windows-package.yml, minus its
# upstream-only guard, release upload and update feed.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  installer:
    name: NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      # Own target dir and static C runtime: the bundler copies resources next
      # to the app, and the hook runs on machines without vcruntime140.dll.
      - name: Build the hook
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p codenotch-hook --target-dir target/hook

      # MIT: keep both notices (root = Codenotch, windows/ = the Windows port)
      # in the install dir; the installer's licence page shows both.
      - name: Collect licence files
        run: |
          $d = 'codenotch/licenses'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item ../LICENSE "$d/LICENSE.txt"
          Copy-Item LICENSE "$d/LICENSE-windows.txt"
          $sep = "`n`n" + ('=' * 72) + "`n`n"
          ((Get-Content "$d/LICENSE.txt" -Raw), (Get-Content "$d/LICENSE-windows.txt" -Raw)) -join $sep |
            Set-Content "$d/installer-license.txt" -Encoding utf8

      # Updater artifacts without a key are a hard bundler error, so they are
      # enabled only when the optional secret exists.
      - name: Can this build be signed?
        id: signing
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $have = -not [string]::IsNullOrWhiteSpace($env:KEY)
          "signed=$($have.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $have) {
            Write-Host '::warning::TAURI_SIGNING_PRIVATE_KEY is not set - building an installer with no update feed.'
          }

      - name: Build the installer
        working-directory: windows/codenotch
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          # Not $args: it is a PowerShell automatic variable and drops the config.
          $cliArgs = @('--config', 'tauri.bundle.conf.json')
          if ($env:SIGNED -eq 'true') {
            $cliArgs += @('--config', '{"bundle":{"createUpdaterArtifacts":true}}')
          }
          npx --yes @tauri-apps/cli@2.11.4 build @cliArgs -- --locked

      - name: Name the installer
        run: |
          $setup = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one installer, found $($setup.Count)" }
          Copy-Item $setup[0].FullName Codenotch-Setup.exe

      - name: Install, run doctor, uninstall
        run: |
          Start-Process -FilePath .\Codenotch-Setup.exe -ArgumentList '/S' -Wait
          $hook = Get-ChildItem $env:LOCALAPPDATA -Filter codenotch-hook.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $hook) { throw 'the installer did not install codenotch-hook.exe' }
          $dir = $hook.DirectoryName
          foreach ($f in 'codenotch.exe', 'uninstall.exe', 'LICENSE.txt', 'LICENSE-windows.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f is not beside codenotch-hook.exe in $dir" }
          }
          Start-Process -FilePath (Join-Path $dir 'codenotch.exe') -ArgumentList 'doctor' `
            -RedirectStandardOutput doctor.txt -Wait
          $doctor = "$(Get-Content doctor.txt -Raw)$(Get-Content (Join-Path $env:APPDATA 'codenotch\doctor.log') -Raw -ErrorAction SilentlyContinue)"
          if ($doctor -notmatch 'Codenotch doctor') { throw "codenotch.exe doctor did not run: $doctor" }
          $doctor
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait

      - uses: actions/upload-artifact@v7
        with:
          name: Codenotch-Setup
          path: windows/Codenotch-Setup.exe
          if-no-files-found: error
